name: Release ear_analytics_core

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Releases (major/minor/patch) are tagged on main, after merging the
      # development branch (e.g. v7) into it. Legacy branches (v5, v6) are only
      # kept for basic client support and may only tag patch releases of their
      # own major version (e.g. v6.1.4 on v6).
      - name: Ensure tag commit is on main, or a patch on its legacy branch
        run: |
          if [[ "${GITHUB_REF}" != refs/tags/v* ]]; then
            echo "::error::This workflow must be triggered by a tag starting with 'v'."
            exit 1
          fi

          TAG="${GITHUB_REF##*/}"      # e.g. v7.0.0
          IFS=. read -r MAJOR MINOR PATCH <<< "${TAG#v}"

          git fetch origin --prune
          COMMIT_SHA=$(git rev-parse HEAD)

          if git branch -r --contains "$COMMIT_SHA" | grep -q "origin/main$"; then
            echo "✅ Commit is contained in main"
          elif git branch -r --contains "$COMMIT_SHA" | grep -q "origin/v${MAJOR}$"; then
            if [[ "$PATCH" == "0" ]]; then
              echo "::error::${TAG} is on legacy branch v${MAJOR}: only patch releases (vX.Y.Z, Z > 0) may be tagged there. Major/minor releases are tagged on main."
              exit 1
            fi
            echo "✅ Patch release ${TAG} on legacy branch v${MAJOR}"
          else
            echo "::error::${TAG} is neither on main nor on branch v${MAJOR}. Aborting release."
            exit 1
          fi

      - name: Check tag version matches pyproject.toml
        run: |
          TAG="${GITHUB_REF##*/}"
          VERSION="${TAG#v}"

          python -m pip install --upgrade pip tomli

          PYPROJECT_VERSION=$(python - << 'EOF'
          import tomli
          from pathlib import Path

          data = tomli.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          print(data["project"]["version"])
          EOF
          )

          echo "Tag version:        $VERSION"
          echo "pyproject version:  $PYPROJECT_VERSION"

          if [ "$VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "::error::Tag version ($VERSION) does not match pyproject.toml version ($PYPROJECT_VERSION)"
            exit 1
          fi

      - name: Install project and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test]" || python -m pip install .

      - name: Run tests
        run: |
          if ! command -v pytest >/dev/null 2>&1; then
            python -m pip install pytest
          fi
          set +e
          pytest
          status=$?
          if [ "$status" -eq 5 ]; then
            echo "No tests collected; continuing."
            exit 0
          fi
          exit "$status"

      - name: Install build tools
        run: python -m pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to public PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_API_TOKEN }}

      - name: Create GitHub Release and upload artifacts
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.whl
            dist/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
